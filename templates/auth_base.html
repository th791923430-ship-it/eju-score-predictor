<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}账号{% endblock %} · 新领域 EJU</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f3f5fa;color:#18243b;font:15px/1.6 system-ui,sans-serif}
    header{background:#172554;color:white;padding:20px max(20px,calc((100% - 1000px)/2));display:flex;justify-content:space-between;align-items:center;gap:20px}
    header a{color:#e0e7ff}main{max-width:1000px;margin:40px auto;padding:0 20px}.panel{background:white;padding:28px;border:1px solid #e2e8f0;border-radius:16px;margin-bottom:24px}.narrow{max-width:440px;margin:50px auto}
    h1{font-size:26px;margin:0 0 12px}h2{font-size:19px}p{color:#53627a}label{display:block;font-weight:600;margin:16px 0 6px}input{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:7px;font:inherit}button,.button{background:#4338ca;color:white;border:0;border-radius:7px;padding:11px 18px;cursor:pointer;font:inherit;text-decoration:none;display:inline-block}button:hover{background:#312e81}.secondary{background:#e2e8f0;color:#18243b}.notice{background:#ecfdf5;color:#065f46;padding:12px;border-radius:8px}.error{background:#fff1f2;color:#9f1239;padding:12px;border-radius:8px}.muted{color:#64748b;font-size:13px}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.actions form{margin:0}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:14px 10px;border-bottom:1px solid #e2e8f0;vertical-align:top}details form{max-width:320px;margin-top:12px}summary{cursor:pointer;color:#4338ca}.scroll{overflow-x:auto}
  </style>
</head>
<body>
  <header><strong>新领域理工塾 · EJU升学推荐</strong>
  {% if g.user %}<div class="actions"><a href="/">推荐系统</a><a href="/account/password">修改密码</a>{% if g.user.role == 'admin' %}<a href="/admin/accounts">账号管理</a>{% endif %}<form action="/logout" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="secondary">退出</button></form></div>{% endif %}
  </header>
  <main>
    {% for message in get_flashed_messages() %}<p class="notice" role="status">{{ message }}</p>{% endfor %}
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
