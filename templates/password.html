{% extends 'auth_base.html' %}
{% block title %}修改密码{% endblock %}
{% block content %}
<section class="panel narrow">
  <h1>{{ '设置你的密码' if g.user.must_change_password else '修改密码' }}</h1>
  <p>{{ '首次登录或密码重置后，请先更换老师提供的初始密码。' if g.user.must_change_password else '更换后需要重新登录，其他设备的登录也会失效。' }}</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="current">当前密码</label><input id="current" name="current_password" type="password" autocomplete="current-password" maxlength="128" required>
    <label for="password">新密码</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
    <label for="confirm">再次输入新密码</label><input id="confirm" name="confirm_password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
    <p class="muted">至少12个字符，可使用较长、易记的短语。</p>
    <button>保存密码</button>
  </form>
</section>
{% endblock %}
